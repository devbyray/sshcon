[package]
name = "sshcon"
version = "0.1.0"
edition = "2024"
description = "A tiny local SSH connection picker that delegates to OpenSSH"
license = "MIT"

[[bin]]
name = "sshcon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
dirs = "6"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
